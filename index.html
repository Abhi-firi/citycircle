<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Circle</title>
<style>
  :root{--bg:#0f1115;--fg:#f4f5f7;--muted:#9aa0ab;--accent:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 8px}
  p{color:var(--muted);margin:0}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-right:10px}
</style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>City Circle</h1>
    <p>Something big is being built here.</p>
  </main>
</body>
</html>
