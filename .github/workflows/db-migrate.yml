name: Database migrations

# Applies SQL files in supabase/migrations to the Supabase project.
# Runs on GitHub's servers, so no one has to paste SQL by hand.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL  the Session pooler connection string from the Supabase
#                    dashboard (Connect > Session pooler), with the real
#                    database password filled in.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is missing"
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"[YOUR-PASSWORD]"*|*"[PASSWORD]"*) echo "::error::SUPABASE_DB_URL still contains the password placeholder"; exit 1 ;;
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must start with postgresql://"; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
