name: Diagnose profile save (temporary)

# Temporary. Creates a throwaway confirmed test user, signs in through the real
# Supabase Auth API and repeats the profile save through the real REST API,
# exactly like the browser does. The test user is deleted at the end.

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-db.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      URL: https://vrtwecmokoxmykxproei.supabase.co
      KEY: sb_publishable_0RJCiYMgABUVAqbFl9d7zA_ngAtDg2T
    steps:
      - name: Reproduce save through the API
        run: |
          set +e
          EMAIL="citycircle-diag-${GITHUB_RUN_ID}@example.invalid"
          PASS="Diag-$(openssl rand -hex 8)"
          echo "$EMAIL" > /tmp/email.txt
          OUT=/tmp/out.txt; : > $OUT

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q <<SQL >> $OUT 2>&1
          insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at,
            raw_app_meta_data, raw_user_meta_data, created_at, updated_at,
            confirmation_token, recovery_token, email_change_token_new, email_change)
          values ('00000000-0000-0000-0000-000000000000', gen_random_uuid(), 'authenticated', 'authenticated',
            '$EMAIL', extensions.crypt('$PASS', extensions.gen_salt('bf')), now(),
            '{"provider":"email","providers":["email"]}', '{"full_name":"Diag"}', now(), now(), '', '', '', '');
          SQL
          echo "create user exit: $?" >> $OUT

          LOGIN=$(curl -sS -w "\n%{http_code}" -X POST "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
          echo "login http: $(echo "$LOGIN" | tail -1)" >> $OUT
          TOKEN=$(echo "$LOGIN" | head -n -1 | jq -r '.access_token // empty')
          UID_=$(echo "$LOGIN" | head -n -1 | jq -r '.user.id // empty')
          if [ -z "$TOKEN" ]; then echo "login body: $(echo "$LOGIN" | head -n -1 | head -c 300)" >> $OUT; fi
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)" >> $OUT

          call() { # name method path body prefer
            R=$(curl -sS -w "\n%{http_code}" -X "$2" "$URL/rest/v1/$3" \
              -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              ${5:+-H "Prefer: $5"} ${4:+-d "$4"})
            echo "$1 -> http $(echo "$R" | tail -1) $(echo "$R" | head -n -1 | head -c 300)" >> $OUT
          }
          call "read profile" GET "profiles?select=id,full_name&id=eq.$UID_"
          call "upsert profiles" POST "profiles" "{\"id\":\"$UID_\",\"full_name\":\"Test\",\"headline\":\"h\",\"about\":null,\"city_slug\":\"delhi\",\"domain_slugs\":[\"vc\"],\"current_role_title\":\"r\",\"current_company\":\"c\",\"skills\":[\"a\",\"b\"],\"linkedin_url\":\"https://x.com\",\"website_url\":\"https://y.com\"}" "resolution=merge-duplicates,return=minimal"
          call "upsert details" POST "profile_details" "{\"user_id\":\"$UID_\",\"experience_years\":5}" "resolution=merge-duplicates,return=minimal"
          call "upsert recruiter" POST "profile_recruiter" "{\"user_id\":\"$UID_\",\"open_to_work\":true,\"notice_period_days\":30,\"expected_ctc_min_lpa\":20,\"expected_ctc_max_lpa\":25}" "resolution=merge-duplicates,return=minimal"
          call "upsert recruiter nulls" POST "profile_recruiter" "{\"user_id\":\"$UID_\",\"open_to_work\":false,\"notice_period_days\":null,\"expected_ctc_min_lpa\":null,\"expected_ctc_max_lpa\":null}" "resolution=merge-duplicates,return=minimal"

          psql "$SUPABASE_DB_URL" -q -c "delete from auth.users where email = '$EMAIL';" >> $OUT 2>&1
          echo "cleanup exit: $?" >> $OUT
          cat $OUT
          msg=$(tr '\n' '|' < $OUT | head -c 3800)
          echo "::error title=API diagnostics::${msg}"
