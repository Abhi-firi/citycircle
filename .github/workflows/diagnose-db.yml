name: Diagnose profile save (temporary)

# Temporary. Reproduces the profile save inside a rolled-back transaction and
# reports grants, policies and the exact database error. Changes no data.

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-db.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Run diagnostics
        run: |
          set +e
          cat > /tmp/diag.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \echo == grants
          select table_name || ' ' || grantee || ' ' || string_agg(privilege_type, ',' order by privilege_type) from information_schema.role_table_grants where table_schema='public' and table_name like 'profile%' and grantee in ('anon','authenticated') group by table_name, grantee order by 1;
          \echo == policies
          select tablename || ' / ' || policyname || ' / ' || cmd || ' / ' || roles::text from pg_policies where schemaname='public' order by 1;
          \echo == profiles columns
          select string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='profiles';
          \echo == auth users and profiles
          select (select count(*) from auth.users) || ' users, ' || (select count(*) from public.profiles) || ' profiles';
          select id as uid from auth.users order by created_at desc limit 1 \gset
          \echo == simulate profiles upsert
          begin;
          set local role authenticated;
          select set_config('request.jwt.claims', json_build_object('sub', :'uid', 'role', 'authenticated')::text, true);
          insert into public.profiles (id, full_name, headline, about, city_slug, domain_slugs, current_role_title, current_company, skills, linkedin_url, website_url) values (:'uid', 'Test', 'h', 'a', 'delhi', '{vc}', 'r', 'c', '{a,b}', 'https://x.com', 'https://y.com') on conflict (id) do update set full_name = excluded.full_name, headline = excluded.headline, about = excluded.about, city_slug = excluded.city_slug, domain_slugs = excluded.domain_slugs, current_role_title = excluded.current_role_title, current_company = excluded.current_company, skills = excluded.skills, linkedin_url = excluded.linkedin_url, website_url = excluded.website_url;
          rollback;
          \echo == simulate details upsert
          begin;
          set local role authenticated;
          select set_config('request.jwt.claims', json_build_object('sub', :'uid', 'role', 'authenticated')::text, true);
          insert into public.profile_details (user_id, experience_years) values (:'uid', 5) on conflict (user_id) do update set experience_years = excluded.experience_years;
          rollback;
          \echo == simulate recruiter upsert
          begin;
          set local role authenticated;
          select set_config('request.jwt.claims', json_build_object('sub', :'uid', 'role', 'authenticated')::text, true);
          insert into public.profile_recruiter (user_id, open_to_work, notice_period_days, expected_ctc_min_lpa, expected_ctc_max_lpa) values (:'uid', true, 30, 20, 25) on conflict (user_id) do update set open_to_work = excluded.open_to_work, notice_period_days = excluded.notice_period_days, expected_ctc_min_lpa = excluded.expected_ctc_min_lpa, expected_ctc_max_lpa = excluded.expected_ctc_max_lpa;
          rollback;
          \echo == done
          SQL
          sed -i 's/^          //' /tmp/diag.sql
          psql "$SUPABASE_DB_URL" -f /tmp/diag.sql > /tmp/out.txt 2>&1
          cat /tmp/out.txt
          msg=$(tr '\n' '|' < /tmp/out.txt | head -c 3800)
          echo "::error title=DB diagnostics::${msg}"
